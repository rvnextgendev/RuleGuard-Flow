services:
  flow:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes: ["flow_data:/workspace/data", "./rules:/workspace/rules:ro"]
  classic:
    build: .
    command: streamlit run app/ui.py --server.address=0.0.0.0
    ports: ["8501:8501"]
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes: ["./rules:/workspace/rules", "./samples:/workspace/samples"]
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    volumes: ["ollama_data:/root/.ollama"]
volumes:
  flow_data:
  ollama_data:
